[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleveling"
version = "0.1.0"
description = "Criador de rotas de level up para Ragnarok Online Renewal (LATAM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ragleveling = "ragleveling.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleveling"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer usa chamadas em default de argumento por design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
